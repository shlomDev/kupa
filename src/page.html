function matching(){const q=$('search').value.trim().toLocaleLowerCase(),byCode=new Map((catalog?.products||[]).map(p=>[p.barcode,p]));let items=view==='promo'?(catalog?.promotions||[]).filter(p=>!['Expired','Upcoming'].includes(promoStatus(p))).map(p=>({...p,category:categoryOf(byCode.get(p.barcodes[0])||{name:p.name}),product:byCode.get(p.barcodes[0])})):(catalog?.products||[]);if(view==='favorites')items=items.filter(p=>favorites.has(favoriteKey(p)));items=items.filter(p=>(!q||[p.name,p.brand,p.barcode,p.product?.name,...(p.barcodes||[])].join(' ').toLocaleLowerCase().includes(q))&&(!$('category').value||categoryOf(p)===$('category').value));return items.sort((a,b)=>$('sort').value==='low'?(a.price??a.discountedPrice??Infinity)-(b.price??b.discountedPrice??Infinity):$('sort').value==='high'?(b.price??b.discountedPrice??-1)-(a.price??a.discountedPrice??-1):$('sort').value==='name'?a.name.localeCompare(b.name,'he'):catName(categoryOf(a)).localeCompare(catName(categoryOf(b)),'he')||a.name.localeCompare(b.name,'he'))}

function imageMarkup(p){const photo=p?.image||metadata[p?.barcode]?.image;return photo?'<img loading="lazy" referrerpolicy="no-referrer" src="'+esc(photo)+'" alt="'+esc(p.name)+'">':'<div class="placeholder">'+icon+'<span>'+tr('תמונה לא זמינה','Image unavailable')+'</span></div>'}
function productCard(p){const el=document.createElement('article');el.className='card';const offers=catalog.promotions.filter(o=>o.barcodes.includes(p.barcode)&&promoStatus(o)!=='Expired');el.innerHTML='<div class="visual" data-barcode="'+esc(p.barcode)+'">'+imageMarkup(p)+'</div><button class="heart" aria-label="'+tr('שמירה למועדפים','Save favorite')+'">'+(favorites.has(favoriteKey(p))?'♥':'♡')+'</button><div class="content"><h3 class="title">'+esc(p.name)+'</h3><p class="subtitle">'+esc([p.brand,p.quantity?[p.quantity,p.unit].filter(Boolean).join(' '):p.unit].filter(Boolean).join(' · '))+'</p><div class="price">'+money(p.price)+'</div>'+(p.unitPrice!==null?'<p class="unit">'+tr('מחיר ליחידת מידה: ','Unit price: ')+money(p.unitPrice)+'</p>':'')+(offers.length?'<span class="badge">'+tr('קיים מבצע','Offer available')+'</span>':'')+'<details><summary>'+tr('פרטי מוצר','Product details')+'</summary><p>'+tr('ברקוד: ','Barcode: ')+esc(p.barcode)+'</p>'+(p.updated?'<p>'+tr('עודכן: ','Updated: ')+esc(p.updated)+'</p>':'')+(!p.category&&!metadata[p.barcode]?.category?'<p>'+tr('סיווג משוער לפי שם המוצר','Category inferred from the product title')+'</p>':'')+(metadata[p.barcode]?.source?'<p>'+esc(metadata[p.barcode].source)+'</p>':'')+'</details></div>';el.querySelector('.heart').onclick=()=>{favorites.has(favoriteKey(p))?favorites.delete(favoriteKey(p)):favorites.add(favoriteKey(p));save('groceryFavorites_v1',[...favorites]);render()};el.querySelector('img')?.addEventListener('error',e=>{e.currentTarget.closest('.visual').innerHTML='<div class="placeholder">'+icon+tr('תמונה לא זמינה','Image unavailable')+'</div>'});return el}
function offerCard(p){const el=document.createElement('article');el.className='card offer';const product=p.product;const rules=[[tr('כמות מינימלית','Minimum quantity'),p.minQty],[tr('עד כמות','Maximum quantity'),p.maxQty],[tr('בקנייה מעל','Minimum spend'),p.minSpend],[tr('מועדון','Club'),p.club],[tr('בתוקף מ־','Valid from'),p.start],[tr('בתוקף עד','Valid until'),p.end],[tr('תנאים','Conditions'),p.restrictions]].filter(x=>x[1]);el.innerHTML='<div class="visual" data-barcode="'+esc(product?.barcode||'')+'">'+imageMarkup(product)+'</div><div class="content"><span class="badge">'+tr('במבצע','On sale')+'</span><h3 class="title">'+esc(p.name)+'</h3><p class="subtitle">'+esc([product?.name,product?.brand,product?.quantity?[product.quantity,product.unit].filter(Boolean).join(' '):''].filter(Boolean).join(' · '))+'</p>'+(p.discountedPrice!==null?'<div class="price">'+money(p.discountedPrice)+'</div><p class="unit">'+tr('מחיר המבצע בכפוף לכמות ולתנאים','Offer amount subject to quantity and conditions')+'</p>':'<p class="unit">'+tr('הנחה בהתאם לתנאי המבצע','Discount subject to offer conditions')+'</p>')+'<div class="rules">'+rules.map(([k,v])=>'<div>'+esc(k)+': '+esc(v)+'</div>').join('')+'</div><details><summary>'+tr('המוצרים המשתתפים','Included products')+'</summary>'+p.barcodes.map(b=>'<p>'+esc(catalog.products.find(x=>x.barcode===b)?.name||b)+'</p>').join('')+'</details></div>';return el}
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.id===(view==='promo'?'promosTab':view==='favorites'?'favoritesTab':'pricesTab'))));$('grid').classList.toggle('list',mode==='list');$('cardsView').setAttribute('aria-pressed',String(mode==='cards'));$('listView').setAttribute('aria-pressed',String(mode==='list'));$('branchTitle').textContent=branch?.name||tr('המוצרים בסניף שלכם','Products at your branch');$('provenance').textContent=branch?[branch.city,branch.address,catalog?.updated?tr('נבדק ','Checked ')+catalog.updated:''].filter(Boolean).join(' · '):tr('בחרו רשת, עיר וסניף כדי להתחיל','Choose a store, city and branch to get started');const chosen=$('category').value,all=view==='promo'?(catalog?.promotions||[]).map(p=>({...p,category:categoryOf(catalog.products.find(x=>x.barcode===p.barcodes[0])||{name:p.name})})):(catalog?.products||[]);const categories=[...new Set(all.map(categoryOf))].sort((a,b)=>catName(a).localeCompare(catName(b),'he'));$('category').replaceChildren(new Option(tr('כל הקטגוריות','All categories'),''),...categories.map(c=>new Option(catName(c),c)));$('category').value=categories.includes(chosen)?chosen:'';const items=matching(),grid=$('grid');grid.replaceChildren();$('retry').classList.toggle('hidden',!branch||loading||!failed.size);$('resultCount').textContent=failed.has(view==='promo'?'promo':'price')&&!catalog?.loaded.has(view==='promo'?'promo':'price')?tr('המחירים לא זמינים כרגע','Prices currently unavailable'):loading?tr('טוענים את המוצרים…','Loading products…'):items.length.toLocaleString()+' '+(view==='promo'?tr('מבצעים','offers'):tr('מוצרים','products'));if(!items.length){const empty=document.createElement('div');empty.className='empty'+(loading?' loading':'');empty.innerHTML='<div class="empty-icon">'+(loading?'◌':branch?'⌕':'⌖')+'</div><strong>'+esc(loading?tr('רגע, מסדרים את המדפים…','Getting the shelves ready…'):!branch?tr('מהסניף שלכם, ישר למסך','Your local shelves, on your screen'):failed.size?tr('לא הצלחנו להתחבר לרשת','Could not connect to this store'):view==='promo'?tr('לא נמצאו מבצעים','No offers found'):tr('לא נמצאו מוצרים','No products found'))+'</strong><p>'+esc(!branch?tr('בחרו רשת ועיר, או לחצו על איתור המיקום. נציג רק סניפים בעיר שלכם.','Choose a store and city, or use location discovery. Only branches in your city will appear.'):loading?tr('המחירים מגיעים ישירות מפרסום הרשת.','Prices are loading from the chain publication.'):tr('נסו שוב או שנו את החיפוש.','Try again or adjust your search.'))+'</p>';grid.append(empty)}let previous='';for(const p of items.slice(0,limit)){const cat=categoryOf(p);if($('sort').value==='category'&&cat!==previous){const h=document.createElement('h3');h.className='category-heading';h.textContent=catName(cat);const count=document.createElement('small');count.textContent=items.filter(x=>categoryOf(x)===cat).length;h.append(count);grid.append(h);previous=cat}grid.append(view==='promo'?offerCard(p):productCard(p))}$('more').classList.toggle('hidden',limit>=items.length);queuePhotos(items.slice(0,limit).map(p=>view==='promo'?p.product:p).filter(Boolean))}
const photoJobs=[];let photoWorkers=0,photoTimer;
function queuePhotos(items){for(const p of items){if(!/^\d{8,14}$/.test(p.barcode)||p.image||metadata[p.barcode]?.checked||photoPending.has(p.barcode))continue;photoPending.add(p.barcode);photoJobs.push(p)}while(photoWorkers<2&&photoJobs.length){photoWorkers++;runPhotoQueue()}}
async function runPhotoQueue(){try{while(photoJobs.length){const p=photoJobs.shift();try{const r=await fetch('/metadata?barcode='+encodeURIComponent(p.barcode),{signal:AbortSignal.timeout(18000)});if(r.ok){const d=await r.json();metadata[p.barcode]={...d,checked:true};save('groceryMetadata_v1',metadata);if(d.image){document.querySelectorAll('[data-barcode]').forEach(el=>{if(el.dataset.barcode===p.barcode&&!el.querySelector('img'))el.innerHTML=imageMarkup(p)})}}}catch{}await new Promise(r=>setTimeout(r,350))}}finally{photoWorkers--}}

for(const [id,v] of [['pricesTab','price'],['promosTab','promo'],['favoritesTab','favorites']])$(id).onclick=()=>{view=v;limit=48;$('category').value='';render();if(branch)loadCatalog(v==='promo'?'promo':'price')};
$('retry').onclick=()=>loadCatalog(view==='promo'?'promo':'price');$('search').oninput=()=>{limit=48;render()};$('category').onchange=$('sort').onchange=()=>{limit=48;render()};$('more').onclick=()=>{limit+=48;render()};$('cardsView').onclick=()=>{mode='cards';save('kupaView',mode);render()};$('listView').onclick=()=>{mode='list';save('kupaView',mode);render()};$('langBtn').onclick=()=>{lang=lang==='he'?'en':'he';save('kupaLanguage_v1',lang);locale()};document.body.classList.toggle('dark',read('groceryTheme','light')==='dark');$('themeBtn').onclick=()=>{document.body.classList.toggle('dark');save('groceryTheme',document.body.classList.contains('dark')?'dark':'light')};locale();
</script></body></html>
