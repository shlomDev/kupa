const photoJobs=[];let photoWorkers=0;
function queuePhotos(items){for(const p of items){const k=photoKey(p.barcode),m=metadata[k];if(!/^\d{1,14}$/.test(p.barcode)||(p.image&&!rejected(p.barcode).has(p.image))||(m?.checked&&Date.now()-(m.checkedAt||0)<(m.image?604800000:900000))||photoPending.has(k))continue;photoPending.add(k);photoJobs.push({p,chain:store,language:lang})}while(photoWorkers<4&&photoJobs.length){photoWorkers++;runPhotoQueue()}}

 }catch{showError(tr('לא הצלחנו לשחזר את הסניף כרגע. הבחירות נשמרו לרענון הבא.','Could not restore the branch right now. Your choices are saved for the next refresh.'))}finally{restoring=false;if(!restoreCancelled&&branch)rememberShopping()}
